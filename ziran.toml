[package]
name = "avif"
module_roots = ["src", "src/bridge"]
entry = "tools/avif.zi"

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "5db3d3c39425d5dfe4bfe4a84e6f6e2e5a810ad0"

[exports]
api = "src/api.zi"
engine = "src/engine.zi"
bmff = "src/bmff.zi"
bridge = "src/bridge.zi"
encode = "src/encode.zi"
preview = "src/preview.zi"

[tool]
project = "build/bin/avif-native"

[artifacts.native]
inputs = ["Makefile", "native/provider.py", "native/CMakeLists.txt", "native/ZiranAvif.cmake", "native/requirements.txt"]
outputs = ["lib/libavif_bridge.so", "lib/libavif.a", "lib/libaom.a", "resources/LICENSE-libavif", "resources/LICENSE-libaom", "resources/PATENTS-libaom", "resources/LICENSE-dav1d", "provenance.json", "link.txt"]

[tool.android.native]
cmake = "native/Android.cmake"

[tool.android.native.modules]
"src/bridge/static.zi" = ["libavif", "dav1d"]
"src/bridge/static_encode.zi" = ["libavif", "dav1d", "libaom"]
"src/bridge/libaom.zi" = ["libavif", "dav1d", "libaom"]

[dependencies.libavif]
git = "https://github.com/AOMediaCodec/libavif.git"
ref = "1aadfad932c98c069a1204261b1856f81f3bc199"
source = true

[dependencies.libaom]
git = "https://aomedia.googlesource.com/aom"
ref = "b141d9c45db236335351c8a4b2a14b3ade27c937"
source = true

[dependencies.image_codec]
git = "https://git.waozi.xyz/ziranlang/image-codec.git"
ref = "3017f0d1cc56975aa29c600a1f55a62e1193cf7b"

[dependencies.av1]
git = "https://git.waozi.xyz/ziranlang/av1.git"
ref = "bed54d12dc5a8cf8e6a514b2a49d3592d6cecb65"

[dependencies.dav1d]
git = "https://github.com/videolan/dav1d.git"
ref = "54706fc6bc0cdecab7e9593974a4039cc038fca7"
source = true
